# GitHub secret scanning: these test files hold fake secrets on purpose (redaction and payload-scan corpora). They are
# built from pieces so no whole key appears (scripts/fake-secrets.test.mjs checks that), and the paths are left out of
# alerts in case a scanner still reads a piece as a secret.
paths-ignore:
  - "skills/lineage/test_lineage.py"
  - "skills/ralph-qa/references/payload-scan.test.mjs"
