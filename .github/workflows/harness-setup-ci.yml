name: harness-setup-ci

# Per-OS "존재 vs 동작" verification for the 0.5.0 harness-setup skills.
# Runs each skill's canonical install + verify on real runners and asserts the tool actually RUNS.
# Honest scope: harness-factory's full Claude-plugin team-spawn and privileged sysctl writes are NOT
# testable on hosted runners; those steps are partial/tolerated and labeled as such.

on:
  push:
    branches: ['feat/**']
    paths:
      - 'skills/setup-*/**'
      - 'skills/harness-factory/**'
      - 'codex/manifest.json'
      - 'scripts/smoke-test.js'
      - '.github/workflows/harness-setup-ci.yml'
  workflow_dispatch:

# A newer run on the same ref cancels the previous one (incl. jobs stuck queued on scarce runners).
concurrency:
  group: harness-setup-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: structural (packaging · 42 skills · dir==name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: manifest count == 42 both / 0 claude-only
        run: |
          node -e "const m=require('./codex/manifest.json');const s=m.surfaces.filter(x=>x.type==='skill');if(s.length!==42||s.filter(x=>x.target!=='both').length!==0){console.error('manifest count wrong',s.length);process.exit(1)}console.log('manifest OK',s.length)"
      - name: smoke-test (dir==name, dry-run, real codex install)
        run: node scripts/smoke-test.js

  rocky8:
    name: rocky8 clean-room (EL8 glibc 2.28)
    runs-on: ubuntu-latest
    container: rockylinux:8
    steps:
      - name: base tools (git for checkout, build deps)
        run: dnf -y install git tar gzip which findutils gcc gcc-c++ make xz >/dev/null
      - uses: actions/checkout@v4
      - name: setup-node (nvm + Node LTS)
        run: |
          set -e
          export NVM_DIR="$HOME/.nvm"; mkdir -p "$NVM_DIR"
          curl -fsSL -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash
          . "$NVM_DIR/nvm.sh"
          nvm install --lts
          node -v && npm -v
          node -e 'process.exit(parseInt(process.version.slice(1))>=18?0:1)'
      - name: setup-python (3.11 + pipx + uv + tomllib)
        run: |
          set -e
          dnf -y module enable python311 >/dev/null 2>&1 || true
          dnf -y install python3.11 python3.11-pip >/dev/null
          python3.11 --version
          python3.11 -m pip install --user pipx >/dev/null
          ~/.local/bin/pipx --version || python3.11 -m pipx --version
          curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null
          "$HOME/.local/bin/uv" --version
          # the skills' tomllib fix depends on a 3.11 interpreter being resolvable:
          python3.11 -c "import tomllib; print('tomllib OK on py3.11 (skills validate config.toml with this)')"
      - name: setup-java (JDK 21)
        run: |
          set -e
          dnf -y install java-21-openjdk-devel >/dev/null
          java -version
          java -version 2>&1 | grep -qE '"(2[1-9]|[3-9][0-9])' && echo "JDK 21+ OK"
      - name: setup-sandbox (bubblewrap + socat present)
        run: |
          set -e
          dnf -y install epel-release >/dev/null 2>&1 || true
          dnf -y install bubblewrap socat >/dev/null
          bwrap --version
          command -v socat && echo "socat OK"
          # privileged sysctl write is not permitted in an unprivileged CI container - read-only report:
          sysctl user.max_user_namespaces 2>/dev/null || echo "(sysctl write not testable in CI container - expected)"
      - name: setup-lsp servers (npm + pipx language servers)
        run: |
          set -e
          . "$HOME/.nvm/nvm.sh"
          export PATH="$HOME/.local/bin:$PATH"
          npm install -g @vtsls/language-server vscode-langservers-extracted bash-language-server >/dev/null
          vtsls --version
          bash-language-server --version
          python3.11 -m pipx install basedpyright >/dev/null 2>&1 || ~/.local/bin/pipx install basedpyright >/dev/null
          python3.11 -m pipx install ruff >/dev/null 2>&1 || ~/.local/bin/pipx install ruff >/dev/null
          basedpyright --version                              # CLI supports --version; the langserver binary is a stdio server
          command -v basedpyright-langserver && echo "basedpyright-langserver present"
          ruff --version

  linux-ubuntu:
    name: ubuntu (apt-pipx path + LSP servers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: setup-python (apt pipx is primary on Debian/Ubuntu)
        run: |
          set -e
          sudo apt-get update >/dev/null
          sudo apt-get install -y pipx >/dev/null
          pipx --version
          curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null
          "$HOME/.local/bin/uv" --version
      - name: setup-lsp servers (npm + pipx)
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          npm install -g @vtsls/language-server bash-language-server >/dev/null
          vtsls --version
          bash-language-server --version
          pipx install basedpyright >/dev/null
          pipx install ruff >/dev/null
          basedpyright --version
          command -v basedpyright-langserver && echo "basedpyright-langserver present"
          ruff --version
      - name: setup-tmux (apt)
        run: |
          set -e
          sudo apt-get install -y tmux >/dev/null
          tmux -V
          tmux new-session -d -s _ci && tmux kill-session -t _ci && echo "tmux spawn OK"
      - name: setup-sandbox (bubblewrap)
        run: |
          set -e
          sudo apt-get install -y bubblewrap socat >/dev/null
          bwrap --version
          bwrap --unshare-user --ro-bind / / true && echo "bwrap userns OK" || echo "userns restricted (runner policy)"

  macos:
    name: macos (brew python/java/tmux)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup-python (brew python@3.11 + pipx + uv)
        run: |
          set -e
          brew install python@3.11 pipx >/dev/null
          "$(brew --prefix python@3.11)/bin/python3.11" --version
          pipx --version
          curl -LsSf https://astral.sh/uv/install.sh | sh >/dev/null
          "$HOME/.local/bin/uv" --version
      - name: setup-java (brew openjdk@21)
        run: |
          set -e
          brew install openjdk@21 >/dev/null
          "$(brew --prefix openjdk@21)/bin/java" -version
      - name: setup-tmux (brew)
        run: |
          set -e
          brew install tmux >/dev/null
          tmux -V
      - name: setup-lsp servers (pipx)
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          pipx install basedpyright >/dev/null
          basedpyright --version
          command -v basedpyright-langserver && echo "basedpyright-langserver present"

  windows:
    name: windows (pwsh $PROFILE UTF-8 + node/python)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: detect + profile UTF-8 no-BOM write (setup-pwsh logic)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "OS env: $env:OS"
          if ($env:OS -ne 'Windows_NT') { throw 'Windows detection ($env:OS) failed on a Windows runner' }
          $PSVersionTable.PSVersion
          # write a marker to a temp profile path using the skill's mandated UTF-8-no-BOM method
          $tmp = Join-Path $env:RUNNER_TEMP 'profile_test.ps1'
          $content = "# BANKER_PWSH_BEGIN`n`$env:PATH = `"`$HOME\.local\bin;`$env:PATH`"`n# BANKER_PWSH_END`n"
          [System.IO.File]::WriteAllText($tmp, $content, (New-Object System.Text.UTF8Encoding($false)))
          $bytes = [System.IO.File]::ReadAllBytes($tmp)
          if ($bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF) { throw 'BOM present - WriteAllText path wrong' }
          Write-Host 'profile written UTF-8 no-BOM OK'
      - name: node + python present (runner-provisioned)
        shell: pwsh
        run: |
          node -v
          python --version

  harness-factory:
    name: harness-factory (Codex meta-harness partial + slug guard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: skill hardcodes the correct install slug (not the KO/JA/quickstart bugs)
        run: |
          set -e
          grep -q 'harness@harness-marketplace' skills/harness-factory/SKILL.md && echo "correct slug present"
          grep -q 'CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS' skills/harness-factory/SKILL.md && echo "experimental flag documented"
          # must NOT present the buggy variants as the install command
          ! grep -qE '^\s*/plugin install harness-marketplace\s*$' skills/harness-factory/SKILL.md && echo "no bare KO/JA bug variant as command"
      - name: Codex port (SaehwanPark/meta-harness installer runs)
        run: |
          set -e
          git clone --depth 1 https://github.com/SaehwanPark/meta-harness /tmp/meta-harness
          test -f /tmp/meta-harness/scripts/install_harness.py && echo "installer present"
          python3 /tmp/meta-harness/scripts/install_harness.py --help >/dev/null 2>&1 && echo "installer --help OK" || echo "installer help not exposed (non-fatal; repo layout may differ)"

  app-runtime:
    name: runtime discovery ${{ matrix.os }} (Claude Code + Codex CLI)
    strategy:
      fail-fast: false
      matrix:
        # macOS Intel (macos-13) intentionally omitted: this job tests runtime skill DISCOVERY
        # (SKILL.md file copy + CLI enumeration), which is architecture-agnostic, so macos-latest
        # (Apple Silicon) substitutes for it. GitHub Intel runners are also being retired/scarce.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: install Codex CLI + Claude Code (npm, no login required)
        shell: bash
        run: |
          npm i -g @openai/codex @anthropic-ai/claude-code
          codex --version
          claude --version
      - name: Codex CLI discovers the 9 new banker skills (no API key)
        shell: bash
        run: |
          set -e
          node bin/banker.js setup --codex --scope user
          SK=$(node -p "require('path').join(require('os').homedir(),'.codex','skills')")
          for s in setup-node setup-python setup-java setup-lsp setup-tmux setup-pwsh setup-mcp setup-sandbox harness-factory; do
            test -f "$SK/banker-$s/SKILL.md" || { echo "MISSING banker-$s in $SK"; exit 1; }
          done
          echo "on-disk: 9 new banker-* skills present (Codex dir==name discovery contract satisfied)"
          if codex debug prompt-input "x" >/tmp/ci.out 2>/tmp/ci.err; then
            n=$(grep -oE 'banker-[a-z0-9-]+' /tmp/ci.out | sort -u | wc -l | tr -d ' ')
            grep -q banker-harness-factory /tmp/ci.out || { echo "codex live render missing new skills"; exit 1; }
            echo "codex debug prompt-input live-exposed $n banker-* skills (incl. new 0.5.0)"
          else
            echo "NOTE: codex debug prompt-input needs a provider config on this runner; on-disk contract already asserted above."
            head -3 /tmp/ci.err || true
          fi
      - name: Claude Code discovers the 9 new banker skills (no auth)
        shell: bash
        run: |
          set -e
          out=$(claude --plugin-dir "$PWD" plugin details banker 2>&1) || { echo "claude plugin details failed:"; echo "$out" | head -12; exit 1; }
          echo "$out" | grep -E 'Skills \(|Component inventory' | head -2
          for s in setup-node setup-python setup-java setup-lsp setup-tmux setup-pwsh setup-mcp setup-sandbox harness-factory; do
            echo "$out" | grep -q "$s" || { echo "MISSING $s in claude plugin details"; exit 1; }
          done
          echo "claude plugin details lists all 9 new skills (no auth)"
